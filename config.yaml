# EV Lab configuration.
# Validated at load time by src/ev_lab/config.py (pydantic, unknown keys rejected).
# YAML pitfall: bare off / no / yes / on parse as booleans. Quote string values.
# See docs/decisions.md for the reasoning behind each default.

project:
  name: "ev-lab"
  offline_only: true        # must stay true; the loader refuses anything else

paths:
  practice: "practice"      # my answer logs (CSV, committed)
  reports: "reports"        # generated reports and figures (committed, small)
  logs: "logs"              # ignored
  data: "data"              # ignored (caches, lookup tables)

logging:
  level: "INFO"
  file: "ev_lab.log"
  max_bytes: 5000000        # rotate at ~5 MB
  backup_count: 5

random:
  seed: 20261109            # root seed; independent streams come from SeedSequence.spawn

monte_carlo:
  trials: 200000            # default number of trials for an exact-vs-simulation check
  tolerance_se: 4.0         # a check passes when |exact - estimate| < tolerance_se * SE

puzzles:
  rel_tolerance: 0.005      # a numeric answer is right when within 0.5% of the exact value

trainer:
  math:
    default_preset: "warmup"
    level: 2                # 1 = easy, 2 = interview pace, 3 = hard
    adaptive_window: 50     # last answers per category used for the adaptive weights
    presets:                # "N questions in M minutes"
      sprint: {questions: 80, minutes: 8}   # format commonly reported for numerical tests
      warmup: {questions: 40, minutes: 8}
      daily: {questions: 40, minutes: 4}    # same pace as sprint, half the length
  market:
    informed_prob: 0.5      # chance that the trader who arrives is informed
    width_fracs: [0.2, 0.12, 0.08]   # max quote width per round, as a share of X's range
    min_width: 1
  daily:
    math_preset: "daily"
  stats:
    weakest_window: 200     # last math answers used to rank my weakest categories
    weakest_min_answers: 5

cards:
  exact_limit: 5000000      # enumerate exactly up to this many (hands, board) scenarios;
                            # above it `ev equity` uses Monte Carlo unless --exact is given
  mc_trials: 200000
